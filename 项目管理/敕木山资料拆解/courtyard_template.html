<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>敕木山民居 · 文献中的形制与院落特征</title>
<style>
:root{--ink:#203d37;--muted:#62736b;--paper:#f4f3ed;--line:#d9dfd6;--green:#216559;--card:#fffef9;--blue:#3f6483}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:26px 30px 23px;background:#21493f;color:#fffdf2}header small{letter-spacing:.16em;color:#bfd3c2}h1{font-size:29px;line-height:1.4;margin:5px 0 9px}header p{margin:0;color:#e0e9df;max-width:1000px}main{padding:22px 26px 32px}h2{font-size:20px;line-height:1.5;margin:0 0 8px}h3{font-size:16px;margin:16px 0 7px}p{margin:8px 0 12px}a{color:var(--green);text-underline-offset:3px}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;color:inherit;border:1px solid #bdcbbf;background:var(--card);border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{background:#edf3e9;border-color:var(--green)}button.active{background:var(--green);color:#fff;border-color:var(--green)}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #bd862c;outline-offset:3px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}.panel{border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden;min-width:0}.panelhead{padding:17px 19px 13px;border-bottom:1px solid var(--line)}.lead{font-size:14px;margin:8px 0 0}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px}.controls button{padding:3px 10px}.controls select{padding:4px 8px;max-width:100%;font-size:13px}.graph-scroll{overflow:auto;background-image:radial-gradient(#c5d1c4 1px,transparent 1px);background-size:20px 20px}svg{display:block;width:100%;height:auto;min-width:600px}.node rect{fill:#fffef8;stroke:#819a89;stroke-width:2}.node.type rect{fill:#e5f1e6;stroke:#5b8a69}.node.organization rect{fill:#eaf0f5;stroke:#6d8ea2}.node .name{font-size:20px;font-weight:650;fill:#203d37}.node .kind{font-size:13px;fill:#657a69}.node .source{font-size:12px;fill:#6b7e70}.node{cursor:pointer}.node.selected rect,.node:focus rect{stroke:#b17a20;stroke-width:4}.edge{cursor:pointer}.edge .hit{stroke:transparent;stroke-width:24;fill:none}.edge .visible{stroke:#738b78;stroke-width:2.4;fill:none}.edge text{font-size:16px;fill:#385c47;paint-order:stroke;stroke:#fffef9;stroke-width:7px;stroke-linejoin:round}.edge.selected .visible{stroke:#b17a20;stroke-width:4}.edge.selected text{fill:#8d5a0d}.rail{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}#inspector{padding:20px;overflow-wrap:anywhere}.badge{display:inline-block;padding:2px 8px;background:#e9efe4;border-radius:5px;font-size:12px;color:#426248}#inspector h2{font-size:24px;margin-top:9px}.uidline{font-size:11px;color:#7c8a7e;margin-top:15px}.field{border-top:1px solid var(--line);padding:10px 0}.field b{font-size:13px}.field p{margin:3px 0 5px}.ref{padding:1px 6px;margin:0 3px 4px 0;font-size:11px;border-color:#d7e0d4}.evidence{border-top:1px solid var(--line);padding:9px 0}.evidence summary{cursor:pointer;font-size:13px}.evbody{padding-top:8px;font-size:13px}blockquote{border-left:3px solid #a6bda2;margin:9px 0;padding:7px 12px;background:#f1f4eb;color:#3c5548}figure{margin:14px 0}figure button{display:block;padding:0;width:100%;border:0;background:transparent}figure img{width:100%;max-height:260px;object-fit:contain;background:#e9ece3;border-radius:6px;display:block}figcaption{font-size:12px;color:var(--muted);margin-top:6px}.case{padding:10px 12px;background:#f1f4eb;border-radius:7px;font-size:13px}.section{padding:20px;margin-top:18px}.findings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.finding{border:1px solid var(--line);border-radius:8px;padding:13px 15px;background:#fffdf6}.finding h3{margin:0 0 7px}.finding p{font-size:14px;margin:0 0 8px}.finding .read{font-size:12px;padding:3px 9px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px}.gallery article{min-width:0}.gallery h3{font-size:16px}.observation{font-size:13px;border-left:3px solid #afbcaa;padding-left:10px}.sources{font-size:14px;overflow-wrap:anywhere}.rules{margin-top:17px;padding-top:15px;border-top:1px solid var(--line)}.rules>summary{cursor:pointer;font-weight:600}.audit{font-size:11px;color:#7b877d;overflow-wrap:anywhere}footer{padding:0 26px 26px;color:var(--muted);font-size:12px}dialog{border:1px solid #b9c7b7;border-radius:12px;background:var(--card);color:var(--ink);max-width:94vw;max-height:94vh;padding:18px}dialog::backdrop{background:#13291dd9}.dialogbar{display:flex;gap:20px;align-items:center;justify-content:space-between}dialog img{display:block;max-width:88vw;max-height:72vh;margin:15px auto;object-fit:contain}.source-label{font-size:12px;color:var(--muted);margin-bottom:7px}.source-divider{grid-column:1/-1;margin:10px 0 0;font-size:14px;font-weight:600;color:#496348}.node:focus{outline:none}.node:focus rect{stroke-dasharray:4 3}.edge:focus{outline:none}.edge:focus .visible{stroke:#b17a20;stroke-width:4}button.ref:empty{display:none}
@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr) 340px}h1{font-size:26px}.findings{grid-template-columns:1fr}}@media(max-width:800px){header{padding:22px 18px}main{padding:16px 14px 26px}.workspace{grid-template-columns:1fr}h1{font-size:25px}.tabs button{padding:7px 11px}.gallery{grid-template-columns:1fr}.section{padding:16px}footer{padding:0 15px 24px}dialog{padding:12px}.controls label{display:none}.graph-scroll{max-width:100%}}
.workspace>div{min-width:0}
</style>
</head>
<body>
<header><small>CHIMUSHAN / ARCHITECTURAL FINDINGS</small><h1>敕木山民居：形制与院落组织</h1><p>从文献已有成果出发，保存形制类型、关键特征与空间联系；原文、图像和案例随内容关联。</p></header>
<main>
<nav id="tabs" class="tabs" aria-label="成果主题"></nav>
<div class="workspace">
<div>
<section class="panel" aria-label="类型与特征关系"><div class="panelhead"><h2 id="viewTitle"></h2><div id="viewDescription" class="muted"></div><p id="leadFinding" class="lead"></p><div class="controls"><label for="selection" class="muted">定位</label><select id="selection" aria-label="选择类型、要素或关系"></select><button id="zoomOut" aria-label="缩小网络">−</button><button id="zoomIn" aria-label="放大网络">＋</button><button id="reset">重置</button></div></div>
<div class="graph-scroll"><svg id="graph" viewBox="0 0 1140 520" xmlns="http://www.w3.org/2000/svg" aria-label="可点击的类型与空间关系"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#738b78"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg></div><div class="rail">点击类型、要素或关系，查看特征与原文。图中位置仅为阅读排版。</div></section>
<section class="panel section"><h2>作者的成果表述</h2><div id="findings" class="findings"></div></section>
</div>
<aside class="panel" aria-label="所选内容与出处"><div id="inspector" aria-live="polite"></div></aside>
</div>
<section class="panel section"><details id="imageNotes"><summary><b>图片说明汇总</b> <span class="muted">· 图像对应成果，局部观察集中在此</span></summary><div id="gallery" class="gallery"></div></details></section>
<section class="panel section"><details id="sourceDetails"><summary><b>来源与阅读记录</b></summary><div id="sources" class="sources"></div><div id="cases" class="sources"></div><p id="reading" class="muted"></p><ul id="principles" class="muted"></ul><p class="audit" id="audit"></p></details></section>
</main><footer id="footer"></footer>
<dialog id="imageDialog"><div class="dialogbar"><b id="dialogTitle"></b><button id="closeDialog">关闭 ×</button></div><img id="dialogImage" alt=""><p id="dialogCaption" class="muted"></p></dialog>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('snapshot').textContent),P=D.pilot;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=Object.fromEntries([...P.nodes,...P.relations,...P.findings,...P.cases].map(x=>[x.id,x]));
const evMap=Object.fromEntries(P.evidence.map(e=>[e.id,e]));
const imageNotes=Object.fromEntries(P.image_notes.map(x=>[x.material,x]));
let mode=P.views[0].id,selected=P.views[0].initial,scale=1;
function shortSource(key){const p=D.papers[key];return `${p.authors.join('、')} · ${p.year}`;}
function cite(e){const p=D.papers[e.paper];return `${p.authors.join('、')}（${p.year}）《${p.title}》；${e.locator}；Zotero ${e.paper}／附件 ${p.attachment}`;}
function refButtons(ids){return ids.map(k=>`<button class="ref" data-evidence="${esc(k)}">${esc(k)}</button>`).join('');}
function imageBlock(id){const a=D.images[id];return `<figure><button data-image="${esc(id)}" aria-label="放大${esc(a.title)}"><img src="${a.data}" alt="${esc(a.title)}"></button><figcaption>${esc(a.title)}<br>${esc(a.locator)} · 图文：${esc(D.papers[a.source_key].authors.join('、'))}</figcaption></figure>`;}
function evidenceBlock(id,open){const e=evMap[id],p=D.papers[e.paper];return `<details class="evidence" id="ev-${esc(id)}" ${open?'open':''}><summary>${esc(shortSource(e.paper))} · PDF ${e.pdf_page} · ${esc(id)}</summary><div class="evbody"><b>${esc(e.attribution)}</b><blockquote>${esc(e.quote)}</blockquote>${e.quote_extra?`<blockquote>${esc(e.quote_extra)}</blockquote>`:''}<p class="muted">${esc(cite(e))}</p><a href="zotero://open-pdf/library/items/${esc(p.attachment)}?page=${e.pdf_page}">在 Zotero 打开原页</a></div></details>`;}
function openImage(id){const a=D.images[id];$('dialogTitle').textContent=a.title;$('dialogImage').src=a.data;$('dialogImage').alt=a.title;$('dialogCaption').textContent=`${a.locator}｜图文：${D.papers[a.source_key].authors.join('、')}｜材料 ${id}`;$('imageDialog').showModal();}
function bindImages(root){root.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>openImage(b.dataset.image));}
function showSelection(id){const o=byId[id];if(!o)throw Error('Unknown record');selected=id;const isEdge=!!o.source,evs=[...new Set(o.evidence)];
 const fields=(o.fields||[]).map(f=>`<div class="field"><b>${esc(f.label)}</b><p>${esc(f.value)}</p>${refButtons(f.evidence)}</div>`).join('');
 const examples=(o.example_refs||[]).map(k=>{const c=byId[k];return `<div class="case"><b>文献例子 · ${esc(c.name)}</b><p>${esc(c.summary)}</p></div>`;}).join('');
 const linkedFindings=P.findings.filter(f=>f.view===mode&&f.evidence.some(k=>evs.includes(k)));
 const images=[...new Set(o.images||linkedFindings.flatMap(f=>f.images||[]))];
 $('inspector').innerHTML=`<span class="badge">${esc(isEdge?'文献所述联系':o.kind||o.attribution||'文献记录')}</span><h2>${esc(o.name||o.title)}</h2>${isEdge?`<p class="muted">${esc(byId[o.source].name)} → ${esc(byId[o.target].name)}</p>`:o.scope?`<p class="muted">${esc(o.scope)}</p>`:''}<p>${esc(o.summary)}</p>${fields}${examples}${images.map(imageBlock).join('')}<h3>原文与出处</h3>${evs.map((k,i)=>evidenceBlock(k,i===0)).join('')}<div class="uidline">记录 ${esc(id)}</div>`;
 $('selection').value=id;document.querySelectorAll('[data-select]').forEach(el=>{el.classList.toggle('selected',el.dataset.select===id);el.setAttribute('aria-pressed',String(el.dataset.select===id));});
 bindImages($('inspector'));$('inspector').querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{const el=$('ev-'+b.dataset.evidence);if(el){el.open=true;el.scrollIntoView({block:'nearest',behavior:'smooth'});}});
}
function lineEnds(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],f=1/Math.max(Math.abs(dx)/114,Math.abs(dy)/47);return [[a[0]+dx*f,a[1]+dy*f],[b[0]-dx*f,b[1]-dy*f]];}
function setView(id){const v=P.views.find(v=>v.id===id);if(!v)throw Error('Unknown view');mode=id;selected=v.initial;scale=1;$('graph').style.width='100%';render();}
function render(){const v=P.views.find(x=>x.id===mode),nodes=v.nodes.map(k=>byId[k]),rels=P.relations.filter(r=>r.views.includes(mode)),findings=P.findings.filter(f=>f.view===mode),pos=k=>v.positions[k];
 $('tabs').innerHTML=P.views.map(v=>`<button class="${v.id===mode?'active':''}" aria-pressed="${v.id===mode}" data-view="${v.id}">${esc(v.name)}</button>`).join('');$('tabs').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
 $('viewTitle').textContent=v.name;$('viewDescription').textContent=v.description;$('leadFinding').textContent=findings[0].summary;
 $('selection').innerHTML=`<optgroup label="类型与要素">${nodes.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('')}</optgroup><optgroup label="联系">${rels.map(r=>`<option value="${r.id}">${esc(byId[r.source].name)} → ${esc(byId[r.target].name)} · ${esc(r.name)}</option>`).join('')}</optgroup>`;
 $('edges').innerHTML=rels.map(r=>{const a=pos(r.source),b=pos(r.target),[s,t]=lineEnds(a,b),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2-12];return `<g class="edge" data-select="${r.id}" role="button" tabindex="0" aria-label="联系：${esc(r.name)}"><title>${esc(r.summary)}</title><path class="hit" d="M${s.join(',')} L${t.join(',')}"/><path class="visible" ${r.alternative_group?'stroke-dasharray="6 4"':''} ${r.name==='紧贴'?'':'marker-end="url(#arrow)"'} d="M${s.join(',')} L${t.join(',')}"/><text x="${mid[0]}" y="${mid[1]}" text-anchor="middle">${esc(r.name)}</text></g>`;}).join('');
 $('nodes').innerHTML=nodes.map(n=>{const p=pos(n.id),cls=/类型|称谓/.test(n.kind)?'type':n.kind==='组织方式'?'organization':'';return `<g class="node ${cls}" transform="translate(${p.join(',')})" data-select="${n.id}" role="button" tabindex="0" aria-label="${esc(n.kind)}：${esc(n.name)}"><title>${esc(n.name)}｜${esc(n.scope)}</title><rect x="-112" y="-45" width="224" height="90" rx="11"/><text class="kind" text-anchor="middle" y="-22">${esc(n.kind)}</text><text class="name" text-anchor="middle" y="6">${esc(n.name)}</text><text class="source" text-anchor="middle" y="29">${esc(shortSource(evMap[n.evidence[0]].paper))}</text></g>`;}).join('');
 $('graph').querySelectorAll('[data-select]').forEach(el=>{el.onclick=()=>showSelection(el.dataset.select);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showSelection(el.dataset.select);}};});
 let lastPaper=null;$('findings').innerHTML=findings.map(f=>{const divider=f.paper!==lastPaper?`<div class="source-divider">${esc(shortSource(f.paper))}</div>`:'';lastPaper=f.paper;return divider+`<article class="finding"><h3>${esc(f.title)}</h3><p>${esc(f.summary)}</p><button class="read" data-finding="${f.id}">原文与配图</button></article>`;}).join('');
 $('findings').querySelectorAll('[data-finding]').forEach(b=>b.onclick=()=>{showSelection(b.dataset.finding);if(innerWidth<800)$('inspector').scrollIntoView({block:'start',behavior:'smooth'});});showSelection(selected);
}
$('selection').onchange=e=>showSelection(e.target.value);
function zoom(d){scale=Math.max(.8,Math.min(2,scale+d));$('graph').style.width=(scale*100)+'%';}
$('zoomIn').onclick=()=>zoom(.2);$('zoomOut').onclick=()=>zoom(-.2);$('reset').onclick=()=>setView(mode);$('closeDialog').onclick=()=>$('imageDialog').close();
$('gallery').innerHTML=P.image_notes.map(r=>`<article><h3>${esc(r.caption)}</h3>${imageBlock(r.material)}<p class="muted">${esc(r.role)}。对应：${r.findings.map(id=>esc(byId[id].title)).join('；')}。</p>${r.observations.map(o=>`<p class="observation"><b>${esc(o.attribution)}：</b>${esc(o.text)}</p>`).join('')}</article>`).join('');bindImages($('gallery'));
$('sources').innerHTML=Object.values(D.papers).map(p=>`<p><b>${esc(shortSource(p.key))}</b>《${esc(p.title)}》；${esc(p.imprint)}。Zotero ${esc(p.key)}／附件 ${esc(p.attachment)}。</p>`).join('');
$('cases').innerHTML='<h3>同篇案例记录</h3>'+P.cases.map(c=>`<p><b>${esc(c.name)}</b>：${esc(c.summary)}</p>`).join('');
$('reading').textContent=P.reading.coverage;$('principles').innerHTML=P.organization.principles.map(t=>`<li>${esc(t)}</li>`).join('');
$('audit').textContent=`来源：拆解主源.json#courtyard_pilot；版本 ${P.version}；主源 SHA-256 ${D.master_sha256}；生成器 ${D.generator_version}。`;
$('footer').textContent='本例为文献成果提取与呈现；同源生成的离线页面，可继续在主源中补充类型、特征及其出处。';
window.CourtyardReview={data:D,getState:()=>({mode,selected,scale}),select:showSelection,setView};render();
</script>
</body>
</html>
