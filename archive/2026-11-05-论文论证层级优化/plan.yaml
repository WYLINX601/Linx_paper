- op: set
  id: section-5-3
  field: completion_gate
  value: 组团划分和结果可复核，描述模式与机制解释分开；对应段落与图表说明有效样本、缺失值、分组与统计分母。跨村比较以实际资料为条件，不预设地域代表性。
- op: set
  id: section-5-4
  field: completion_gate
  value: 共同、典型与特殊个案分开；无比较证据不称畲族独有；对应段落与图表说明有效样本、缺失值、分组与统计分母。跨村比较以实际资料为条件，不预设地域代表性。
- op: set
  id: section-5-5
  field: completion_gate
  value: 形成跨尺度对应及有原始依据的建筑学解释，不重复单尺度统计；区分样本共同特征、差异特征与畲族特有特征，不把关联推为因果或民族专属性；对应段落与图表说明有效样本、缺失值、分组与统计分母。跨村比较以实际资料为条件，不预设地域代表性。
- op: set
  id: section-5-5
  field: purpose
  value: 分析单体类型、院落组织、组团组合与街巷界面之间的联系、重复组合及特殊情形，形成超出分尺度复述的建筑学认识；按发现—实例与图表证据—解释—适用范围及反例组织。关系及共现不等于文化成因，不借综合分析恢复演变或感知研究。
