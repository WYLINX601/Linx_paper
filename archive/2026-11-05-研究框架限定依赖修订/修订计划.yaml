operations:
- op: rename
  id: section-3-4
  title: 图谱实例化规则与质量控制方法
- op: set
  id: section-3-4
  field: change_note
  value: 2026-10-29用户确认体系—实例图谱—风貌分析分工；由“记录、图谱实现与查询的操作流程”调整，保留稳定ID及原稿接续；正文未改写；2026-10-29标题与逻辑梳理：由“知识图谱构建与查询分析的通用规则”接续，仍为工作大纲，正文不改；2026-11-05按用户提供的最终归并方案下移层级，保留稳定ID、原稿入口和证据任务；2026-11-05用户同意最小修订：吸收研究框架审阅意见并保留主会话限定；不增加章目，不改正文或实证状态。来源：研究资料/来源证据/2026-11-05-研究框架审阅意见.md
- op: rename
  id: section-5-5
  title: 跨尺度风貌关联与综合特征分析
- op: set
  id: section-5-5
  field: change_note
  value: 2026-10-29用户确认体系—实例图谱—风貌分析分工；由“跨尺度查询与三维关联支持的风貌比较”调整，保留稳定ID及原稿接续；正文未改写；2026-10-29标题与逻辑梳理：由“跨尺度风貌关联与样本综合比较”接续，仍为工作大纲，正文不改；2026-11-05用户同意最小修订：吸收研究框架审阅意见并保留主会话限定；不增加章目，不改正文或实证状态。来源：研究资料/来源证据/2026-11-05-研究框架审阅意见.md
- op: set
  id: section-3-type-methods
  field: purpose
  value: 以3.2的特征判据及3.3中对象、特征与关系的统一定义为结构化基础，规定由记录及关系形成局部类型、组合变体、空间差异和有据解释的程序；与建库流程分开，不以数据库导入或全部三维关联完成作为普遍前提，规则允许依据真实比较中的变体与反例迭代。
- op: set
  id: section-3-type-methods
  field: question
  value: 如何依据统一表达的特征与关系制定类型识别和比较程序，并保留未知、反例与规则修订，而不将其混同为数据库导入步骤？
- op: set
  id: section-3-type-methods
  field: completion_gate
  value: 区分对象类别、文献原类型、候选类型和样本支持类型；不预设唯一总类型、不强制聚类、不把候选规则写成已验证方法。 对象、特征与关系的统一表达支撑比较，不将建库或全部三维关联设为所有类型分析的必经步骤；反例与适配可反馈修订规则，并保留版本与依据。
- op: set
  id: section-3-type-methods
  field: change_note
  value: 2026-11-05依据用户提供的目录讨论末轮方案新增论证层级；不是实证成果或已完成正文；2026-11-05用户同意最小修订：吸收研究框架审阅意见并保留主会话限定；不增加章目，不改正文或实证状态。来源：研究资料/来源证据/2026-11-05-研究框架审阅意见.md
