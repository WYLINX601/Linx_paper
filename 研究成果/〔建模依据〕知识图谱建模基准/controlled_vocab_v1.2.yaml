# 1. 实例角色分类（严格剥离非民居样本，对齐 1.4.1 与 3.3.2）
entity_roles:
  VernacularHouse: "核心传统民居样本（含宅祠合一传统住宅、主体木构可辨的微改老宅）"
  EnvNode: "历史环境关联节点（独立宗祠/行宫/寺庙/廊桥/牌坊，不计入民居统计分母）"
  ContrastModernBuilding: "现代对照建筑（安置新村砖混农房/商业新建仿古设施，剥离排除）"

# 2. 双层证据与认知状态（融合 PROV-O 溯源思想与 D02/U17 未知原因规则）
evidence_statuses:
  - 规划记载      # 法定保护规划文本、名录或分类保护图则核定记录
  - 实测观察      # 学术测绘图纸、历史调查实录、无人机三维或现场踏勘事实
  - 账实冲突      # 同一对象同一部位的“规划记载”与“实测观察”取值互斥
  - 档案缺口      # 存量资料未载且受遮挡未入户（如 L2 民居内部平面与穿斗构架）

epistemic_states:
  - 已知存在      # 有明确原文或图像/实测支撑
  - 明确无        # 经核查确认不存在该部件/改建（严禁将“原文未提及”标为明确无）
  - 未知_文献未载 # 仅见外部或名录，文献未描述该部位
  - 未知_航测遮挡 # 屋面挑檐或植被遮挡，待地面/入户补证
  - 不适用        # 该结构体系不存在此问题（如纯承重墙局部不强造穿斗榀架）

# 3. 法定保护等级与条款管控极性（对齐《浙江省传统村落保护利用指南》）
protection_grades: ["文物建筑", "历史建筑", "传统风貌建筑", "其他建筑(非保护对照)", "未定级"]
clause_polarities: ["原真保留(禁止拆改)", "风貌协调(受控修缮)", "适应性微改(有条件允许)"]

